<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>桌宠装扮</title>
<link rel="stylesheet" href="/web/pet.css">
<link rel="stylesheet" href="/web/dress.css">
</head>
<body class="dress-page">
<main>
  <div class="preview" id="preview" aria-label="预览">
    <svg id="stageSvg" aria-hidden="true">
      <ellipse id="shadow" class="shadow" cx="0" cy="0" rx="0" ry="0"/>
      <g id="pet"></g>
      <g id="fx"></g>
    </svg>
    <button class="tool mode" id="mode" type="button"></button>
    <p class="saved" id="saved" aria-live="polite"></p>
  </div>
  <div class="dress" id="dress">
    <div class="row-label" id="lbPalette">配色</div><div class="slot" id="optPalette" role="group" aria-labelledby="lbPalette"></div>
    <div class="row-label" id="lbHead">头顶</div><div class="slot" id="optHead" role="group" aria-labelledby="lbHead"></div>
    <div class="row-label" id="lbSide">配件</div><div class="slot" id="optSide" role="group" aria-labelledby="lbSide"></div>
    <div class="row-label" id="lbGlasses">眼镜</div><div class="slot" id="optGlasses" role="group" aria-labelledby="lbGlasses"></div>
    <div class="row-label" id="lbNeck">颈饰</div><div class="slot" id="optNeck" role="group" aria-labelledby="lbNeck"></div>
  </div>
</main>
<script type="module" src="/web/dress.js"></script>
</body>
</html>
